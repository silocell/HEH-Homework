<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Homework Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   LAYOUT: a squared-exercise-book sheet. Faint grid ground,
   one red margin rule, cards sitting on the page like
   stuck-in worksheets. Everything derives from the tokens below.
   ============================================================ */
:root{
  --paper:#f7f6f2;
  --card:#ffffff;
  --ink:#1a1f2b;
  --ink-soft:#5b6476;
  --ink-faint:#8d95a5;
  --rule:#d9dce4;
  --grid:rgba(26,31,43,.045);
  --accent:#1f4fd8;        /* biro blue */
  --accent-soft:#e7edfd;
  --margin:#d2403c;        /* the red margin line */
  --good:#1d7a4c;
  --shadow:0 1px 2px rgba(26,31,43,.06),0 8px 24px -12px rgba(26,31,43,.18);
  --radius:14px;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11141b;
    --card:#191d26;
    --ink:#eceef3;
    --ink-soft:#a3abbb;
    --ink-faint:#737d90;
    --rule:#2b3140;
    --grid:rgba(236,238,243,.04);
    --accent:#7aa0ff;
    --accent-soft:#1d2740;
    --margin:#e0605c;
    --good:#4fc08a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141b;
  --card:#191d26;
  --ink:#eceef3;
  --ink-soft:#a3abbb;
  --ink-faint:#737d90;
  --rule:#2b3140;
  --grid:rgba(236,238,243,.04);
  --accent:#7aa0ff;
  --accent-soft:#1d2740;
  --margin:#e0605c;
  --good:#4fc08a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- LOGIN ---------- */
.gate{
  min-height:100vh;
  display:flex;
  padding:24px;
}
.gate-card{margin:auto}
.gate-card{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--rule);
  border-left:5px solid var(--margin);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:34px 30px 30px;
}
.gate-card h1{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.65rem;
  line-height:1.15;
  margin:0 0 6px;
  letter-spacing:-.02em;
  text-wrap:balance;
}
.gate-card .sub{
  color:var(--ink-soft);
  font-size:.875rem;
  margin:0 0 26px;
}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.field input{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:9px;
  padding:11px 13px;
  font-size:.95rem;
  width:100%;
}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:9px;
  padding:12px 18px;
  font-weight:600;
  font-size:.95rem;
  cursor:pointer;
  width:100%;
  transition:filter .15s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{filter:brightness(.94)}
.gate-error{
  color:var(--margin);
  font-size:.85rem;
  min-height:1.2em;
  margin:12px 0 0;
  font-weight:500;
}
.gate-note{
  margin:22px 0 0;
  padding-top:16px;
  border-top:1px solid var(--rule);
  font-size:.75rem;
  color:var(--ink-faint);
  line-height:1.5;
}
.remember{
  display:flex;align-items:center;gap:8px;
  font-size:.82rem;color:var(--ink-soft);margin:2px 0 20px;
}
.remember input{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* ---------- SHELL ---------- */
.shell{max-width:1120px;margin:0 auto;padding:28px 20px 72px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:26px;
}
.brand{
  font-family:var(--font-display);
  font-weight:800;font-size:1rem;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px;
}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--margin);flex:none}
.topbar-actions{display:flex;align-items:center;gap:8px}
.ghost-btn{
  background:transparent;border:1px solid var(--rule);
  border-radius:8px;padding:7px 12px;font-size:.8rem;font-weight:500;
  color:var(--ink-soft);cursor:pointer;transition:border-color .15s,color .15s;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- GREETING ---------- */
.greeting{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:5px solid var(--margin);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 28px;
  margin-bottom:20px;
}
.greeting h2{
  font-family:var(--font-display);
  font-weight:800;font-size:clamp(1.4rem,4vw,2rem);
  margin:0 0 6px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance;
}
.greeting .meta{
  font-family:var(--font-mono);
  font-size:.75rem;color:var(--ink-faint);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
}

/* ---------- SEARCH ---------- */
.searchbar{
  display:flex;gap:9px;margin-bottom:24px;flex-wrap:wrap;
}
.searchbar input{
  flex:1 1 240px;min-width:0;
  background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:13px 15px;font-size:.95rem;
  box-shadow:var(--shadow);
}
.searchbar input:focus{border-color:var(--accent);outline:none}
.searchbar select{
  background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:0 12px;font-size:.85rem;
  color:var(--ink-soft);cursor:pointer;box-shadow:var(--shadow);
  min-height:46px;
}
.searchbar .btn{width:auto;flex:none;padding:12px 22px}

/* ---------- GRID / SECTIONS ---------- */
.columns{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:900px){ .columns{grid-template-columns:1.45fr 1fr} }

.panel{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.panel + .panel{margin-top:20px}
.panel-title{
  font-size:.7rem;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);
  margin:0 0 14px;
}
.group-label{
  font-size:.68rem;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);
  margin:22px 0 10px;
}
.group-label:first-of-type{margin-top:0}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.tile{
  display:flex;align-items:center;gap:11px;
  padding:13px 13px;
  border:1px solid var(--rule);
  border-radius:11px;
  text-decoration:none;color:var(--ink);
  background:var(--paper);
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
  min-width:0;
}
.tile:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
  box-shadow:0 6px 16px -8px rgba(31,79,216,.4);
}
.chip{
  width:36px;height:36px;flex:none;border-radius:9px;
  display:grid;place-items:center;overflow:hidden;
  background:var(--paper);border:1px solid var(--rule);
}
.chip img{width:23px;height:23px;object-fit:contain;display:block}
.chip.mono{
  border:none;color:#fff;
  font-family:var(--font-display);font-weight:800;font-size:.8rem;
  letter-spacing:-.02em;
}
.tile-name{
  font-size:.86rem;font-weight:600;line-height:1.25;min-width:0;
  overflow-wrap:anywhere;
}
.tile-sub{font-size:.7rem;color:var(--ink-faint);line-height:1.2;margin-top:2px}

/* ---------- WORD OF THE DAY ---------- */
.wotd-word{
  font-family:var(--font-display);
  font-weight:800;font-size:clamp(1.5rem,5vw,2rem);
  letter-spacing:-.025em;margin:0 0 3px;line-height:1.1;
  overflow-wrap:anywhere;
}
.wotd-pos{
  font-family:var(--font-mono);font-size:.74rem;
  color:var(--accent);margin-bottom:11px;letter-spacing:.02em;
}
.wotd-def{font-size:.93rem;line-height:1.55;margin:0 0 10px;color:var(--ink)}
.wotd-ex{
  font-size:.85rem;line-height:1.5;color:var(--ink-soft);
  font-style:italic;margin:0;
  padding-left:11px;border-left:2px solid var(--rule);
}
.lookup{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.lookup input{
  flex:1;min-width:0;background:var(--paper);
  border:1px solid var(--rule);border-radius:9px;
  padding:9px 12px;font-size:.87rem;
}
.lookup input:focus{border-color:var(--accent);outline:none}
.lookup button{
  flex:none;background:var(--accent-soft);color:var(--accent);
  border:none;border-radius:9px;padding:9px 15px;
  font-size:.85rem;font-weight:600;cursor:pointer;
}
.lookup button:hover{filter:brightness(.96)}
.lookup-result{
  margin-top:14px;font-size:.88rem;line-height:1.55;
  color:var(--ink-soft);
}
.lookup-result strong{color:var(--ink)}
.lookup-result .lr-pos{
  font-family:var(--font-mono);font-size:.72rem;color:var(--accent);
  display:block;margin-bottom:4px;
}

/* ---------- TODO ---------- */
.todo-add{display:flex;gap:8px;margin-bottom:14px}
.todo-add input{
  flex:1;min-width:0;background:var(--paper);
  border:1px solid var(--rule);border-radius:9px;
  padding:10px 12px;font-size:.88rem;
}
.todo-add input:focus{border-color:var(--accent);outline:none}
.todo-add button{
  flex:none;background:var(--accent);color:#fff;border:none;
  border-radius:9px;width:42px;font-size:1.15rem;cursor:pointer;line-height:1;
}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 6px;border-bottom:1px solid var(--rule);
}
.todo-item:last-child{border-bottom:none}
.todo-item input[type=checkbox]{
  width:17px;height:17px;margin:2px 0 0;flex:none;
  accent-color:var(--good);cursor:pointer;
}
.todo-text{flex:1;font-size:.89rem;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--ink-faint)}
.todo-del{
  flex:none;background:none;border:none;color:var(--ink-faint);
  cursor:pointer;font-size:1rem;line-height:1;padding:2px 5px;border-radius:5px;
}
.todo-del:hover{color:var(--margin);background:var(--paper)}
.empty{
  font-size:.85rem;color:var(--ink-faint);
  padding:14px 4px;line-height:1.5;
}
.todo-count{
  font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);
  margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);
  font-variant-numeric:tabular-nums;
}

footer{
  margin-top:34px;font-size:.72rem;color:var(--ink-faint);
  text-align:center;line-height:1.6;
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Homework Launchpad</h1>
    <p class="sub">Sign in to pick up where you left off.</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="off" required>
      </div>
      <div class="remember">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe" style="text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:400;color:var(--ink-soft)">Keep me signed in for 15 days</label>
      </div>
      <button type="submit" class="btn">Sign in</button>
      <p class="gate-error" id="gateError"></p>
    </form>
  </div>
</div>

<!-- ============================================================
     DASHBOARD
     ============================================================ -->
<div class="shell" id="dash" hidden>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> Homework Launchpad</div>
    <div class="topbar-actions">
      <button class="ghost-btn" id="themeBtn" type="button">Dark mode</button>
      <button class="ghost-btn" id="switchBtn" type="button">Switch user</button>
    </div>
  </div>

  <div class="greeting">
    <h2 id="greetingText">Hello</h2>
    <div class="meta" id="dateText"></div>
  </div>

  <form class="searchbar" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search the web…" autocomplete="off" aria-label="Search the web">
    <select id="engineSelect" aria-label="Search engine">
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
    </select>
    <button type="submit" class="btn">Search</button>
  </form>

  <div class="columns">

    <!-- LEFT: links -->
    <div>
      <div class="panel">
        <p class="panel-title">Everything in one place</p>
        <div id="tileGroups"></div>
      </div>
    </div>

    <!-- RIGHT: word of the day + to-do -->
    <div>
      <div class="panel">
        <p class="panel-title">Word of the day</p>
        <p class="wotd-word" id="wotdWord">—</p>
        <div class="wotd-pos" id="wotdPos"></div>
        <p class="wotd-def" id="wotdDef"></p>
        <p class="wotd-ex" id="wotdEx"></p>
        <form class="lookup" id="lookupForm">
          <input type="text" id="lookupInput" placeholder="Look up any word…" autocomplete="off" aria-label="Look up a word">
          <button type="submit">Define</button>
        </form>
        <div class="lookup-result" id="lookupResult"></div>
      </div>

      <div class="panel">
        <p class="panel-title">To-do</p>
        <form class="todo-add" id="todoForm">
          <input type="text" id="todoInput" placeholder="What's due?" autocomplete="off" aria-label="Add a to-do item">
          <button type="submit" aria-label="Add">+</button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
        <div class="todo-count" id="todoCount"></div>
      </div>
    </div>

  </div>

  <footer>
    Saved on this computer only — to-do items don't travel with the file.<br>
    Word of the day changes at midnight.
  </footer>
</div>

<script>
/* ==================================================================
   ACCOUNTS — EDIT THIS BLOCK
   ------------------------------------------------------------------
   Passwords are stored scrambled, so they do not appear in this file.

   TO CHANGE A PASSWORD:
     1. Open this page in a browser and press F12 to open the console.
     2. Type:   hashFor("User1", "yournewpassword")
     3. Copy the long string it prints and paste it as the hash below.

   This keeps passwords out of plain sight. It is not real security —
   a short or obvious password can still be worked back out.
   ================================================================== */
var SALT = "hl$2026$";

var ACCOUNTS = [
  { login:"User1", name:"Shiv",  full:"Shiv Kumar",
    hash:"b3f2854db4e0d083007e3d1093f4d1def946857297ed05e3d2aed06484fe8ce0" },
  { login:"User2", name:"Shlok", full:"Shlok Patel",
    hash:"7bb6f6af193ea5585ff219f9ed07be112678f2c11574840c3dad503ec6e9dd37" }
];

/* --- password scrambling (SHA-256), works offline and on https --- */
function sha256(ascii){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  var K=[],H=[],i,j,p=2,isP;
  if(!sha256.k){
    K=[];H=[];p=2;
    for(i=0;i<64;){
      isP=true;
      for(j=2;j*j<=p;j++){ if(p%j===0){isP=false;break;} }
      if(isP){
        if(i<8){ H[i]=(Math.pow(p,1/2)%1*4294967296)|0; }
        K[i]=(Math.pow(p,1/3)%1*4294967296)|0;
        i++;
      }
      p++;
    }
    sha256.k=K; sha256.h=H;
  }
  K=sha256.k; H=sha256.h.slice(0);

  var bytes=[],c;
  for(i=0;i<ascii.length;i++){
    c=ascii.charCodeAt(i);
    if(c<128){bytes.push(c);}
    else if(c<2048){bytes.push(192|(c>>6),128|(c&63));}
    else if(c<55296||c>=57344){bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}
    else{ i++; c=65536+(((c&1023)<<10)|(ascii.charCodeAt(i)&1023));
      bytes.push(240|(c>>18),128|((c>>12)&63),128|((c>>6)&63),128|(c&63)); }
  }
  var bitLen=bytes.length*8;
  bytes.push(128);
  while(bytes.length%64!==56){bytes.push(0);}
  var hi=Math.floor(bitLen/4294967296), lo=bitLen>>>0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
             (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);

  var w=new Array(64),a,b,cc,d,e,f,g,h,s0,s1,t1,t2,ch,maj;
  for(j=0;j<bytes.length;j+=64){
    for(i=0;i<16;i++){
      w[i]=(bytes[j+i*4]<<24)|(bytes[j+i*4+1]<<16)|(bytes[j+i*4+2]<<8)|bytes[j+i*4+3];
    }
    for(i=16;i<64;i++){
      s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3);
      s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    a=H[0];b=H[1];cc=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(i=0;i<64;i++){
      s1=rr(6,e)^rr(11,e)^rr(25,e);
      ch=(e&f)^(~e&g);
      t1=(h+s1+ch+K[i]+w[i])|0;
      s0=rr(2,a)^rr(13,a)^rr(22,a);
      maj=(a&b)^(a&cc)^(b&cc);
      t2=(s0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out="";
  for(i=0;i<8;i++){ out+=("00000000"+((H[i]>>>0).toString(16))).slice(-8); }
  return out;
}

function hashFor(login, password){
  return sha256(SALT + String(login).toLowerCase() + ":" + password);
}
window.hashFor = hashFor;

var REMEMBER_DAYS = 15;

/* ==================================================================
   LINKS — EDIT THIS BLOCK to add or remove tiles

/* ==================================================================
   STORAGE HELPERS — all wrapped, so a blocked localStorage
   never breaks the page.
   ================================================================== */
function store(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){}
}
function recall(key,fallback){
  try{
    var raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  }catch(e){ return fallback; }
}
function forget(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

var SESSION_KEY = "hl.session";
var THEME_KEY   = "hl.theme";
function todoKey(login){ return "hl.todo." + login; }

/* ==================================================================
   AUTH
   ================================================================== */
var currentUser = null;

function findAccount(typed){
  var t = String(typed||"").trim().toLowerCase();
  for(var i=0;i<ACCOUNTS.length;i++){
    var a = ACCOUNTS[i];
    if(t === a.login.toLowerCase() || t === a.name.toLowerCase()) return a;
  }
  return null;
}

function restoreSession(){
  var s = recall(SESSION_KEY,null);
  if(!s || !s.login || !s.expires) return null;
  if(Date.now() > s.expires){ forget(SESSION_KEY); return null; }
  for(var i=0;i<ACCOUNTS.length;i++){
    if(ACCOUNTS[i].login === s.login) return ACCOUNTS[i];
  }
  return null;
}

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  var err = document.getElementById("gateError");
  var acc = findAccount(document.getElementById("username").value);
  var pwd = document.getElementById("password").value;

  if(!acc || hashFor(acc.login, pwd) !== acc.hash){
    err.textContent = "That username and password don't match. Try again.";
    document.getElementById("password").value = "";
    return;
  }
  err.textContent = "";
  if(document.getElementById("rememberMe").checked){
    store(SESSION_KEY,{ login:acc.login, expires: Date.now() + REMEMBER_DAYS*86400000 });
  }
  openDashboard(acc);
});

document.getElementById("switchBtn").addEventListener("click",function(){
  forget(SESSION_KEY);
  currentUser = null;
  document.getElementById("dash").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("gateError").textContent = "";
  document.getElementById("username").focus();
});

/* ==================================================================
   DASHBOARD
   ================================================================== */
function openDashboard(acc){
  currentUser = acc;
  document.getElementById("gate").hidden = true;
  document.getElementById("dash").hidden = false;
  paintGreeting();
  paintWord();
  renderTodos();
  document.getElementById("searchInput").focus();
}

function paintGreeting(){
  var now  = new Date();
  var line = LINES[Math.floor(Math.random()*LINES.length)];
  document.getElementById("greetingText").textContent =
    timeWord(now.getHours()) + " " + currentUser.name + ", " + line;
  document.getElementById("dateText").textContent =
    now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

/* ---------- tiles ---------- */
(function buildTiles(){
  var host = document.getElementById("tileGroups");
  var html = "";
  for(var g=0; g<GROUPS.length; g++){
    html += '<p class="group-label">' + GROUPS[g].label + '</p><div class="tiles">';
    for(var i=0; i<GROUPS[g].items.length; i++){
      var it = GROUPS[g].items[i];
      var badge = (it.icon && ICONS[it.icon])
        ? '<span class="chip"><img src="' + ICONS[it.icon] + '" alt=""></span>'
        : '<span class="chip mono" style="background:' + it.color + '">' + it.mark + '</span>';
      html +=
        '<a class="tile" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
          badge +
          '<span style="min-width:0">' +
            '<span class="tile-name">' + it.name + '</span>' +
            '<span class="tile-sub" style="display:block">' + it.sub + '</span>' +
          '</span>' +
        '</a>';
    }
    html += '</div>';
  }
  host.innerHTML = html;
})();

/* ---------- web search ---------- */
document.getElementById("searchForm").addEventListener("submit",function(e){
  e.preventDefault();
  var q = document.getElementById("searchInput").value.trim();
  if(!q) return;
  var base = document.getElementById("engineSelect").value;
  window.open(base + encodeURIComponent(q), "_blank", "noopener");
  document.getElementById("searchInput").value = "";
});

/* ---------- word of the day ---------- */
function dayIndex(){
  var now = new Date();
  var days = Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) / 86400000);
  return ((days % WORDS.length) + WORDS.length) % WORDS.length;
}
function paintWord(){
  var e = WORDS[dayIndex()];
  document.getElementById("wotdWord").textContent = e.w;
  document.getElementById("wotdPos").textContent  = e.p;
  document.getElementById("wotdDef").textContent  = e.d;
  document.getElementById("wotdEx").textContent   = e.e;
}

/* ---------- live dictionary lookup ---------- */
document.getElementById("lookupForm").addEventListener("submit",function(e){
  e.preventDefault();
  var word = document.getElementById("lookupInput").value.trim();
  var out  = document.getElementById("lookupResult");
  if(!word) return;
  out.textContent = "Looking up " + word + "…";

  fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word))
    .then(function(r){
      if(!r.ok) throw new Error("notfound");
      return r.json();
    })
    .then(function(data){
      var entry = data[0];
      var m = entry.meanings[0];
      var d = m.definitions[0];
      out.innerHTML = "";
      var strong = document.createElement("strong");
      strong.textContent = entry.word;
      var pos = document.createElement("span");
      pos.className = "lr-pos";
      pos.textContent = m.partOfSpeech;
      var def = document.createElement("span");
      def.textContent = " — " + d.definition;
      out.appendChild(strong);
      out.appendChild(def);
      out.insertBefore(pos, strong);
      if(d.example){
        var ex = document.createElement("div");
        ex.style.marginTop = "6px";
        ex.style.fontStyle = "italic";
        ex.textContent = d.example;
        out.appendChild(ex);
      }
    })
    .catch(function(){
      out.textContent = "No definition found for “" + word + "”. Check the spelling, or you may be offline.";
    });
});

/* ---------- to-do ---------- */
function getTodos(){ return recall(todoKey(currentUser.login), []); }
function setTodos(list){ store(todoKey(currentUser.login), list); }

function renderTodos(){
  var list  = getTodos();
  var host  = document.getElementById("todoList");
  var count = document.getElementById("todoCount");
  host.innerHTML = "";

  if(!list.length){
    var p = document.createElement("li");
    p.className = "empty";
    p.textContent = "Nothing on the list. Add what's due and tick it off as you go.";
    host.appendChild(p);
    count.textContent = "";
    return;
  }

  list.forEach(function(item,idx){
    var li = document.createElement("li");
    li.className = "todo-item" + (item.done ? " done" : "");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!item.done;
    cb.id = "todo-" + idx;
    cb.addEventListener("change",function(){
      var l = getTodos(); l[idx].done = cb.checked; setTodos(l); renderTodos();
    });

    var label = document.createElement("label");
    label.className = "todo-text";
    label.setAttribute("for","todo-" + idx);
    label.textContent = item.text;

    var del = document.createElement("button");
    del.className = "todo-del";
    del.type = "button";
    del.setAttribute("aria-label","Remove " + item.text);
    del.textContent = "×";
    del.addEventListener("click",function(){
      var l = getTodos(); l.splice(idx,1); setTodos(l); renderTodos();
    });

    li.appendChild(cb); li.appendChild(label); li.appendChild(del);
    host.appendChild(li);
  });

  var left = list.filter(function(i){ return !i.done; }).length;
  count.textContent = left === 0
    ? "All done — " + list.length + " cleared"
    : left + " left of " + list.length;
}

document.getElementById("todoForm").addEventListener("submit",function(e){
  e.preventDefault();
  var input = document.getElementById("todoInput");
  var text  = input.value.trim();
  if(!text) return;
  var list = getTodos();
  list.push({ text:text, done:false });
  setTodos(list);
  input.value = "";
  renderTodos();
});

/* ---------- theme ---------- */
function applyTheme(mode){
  if(mode === "dark" || mode === "light"){
    document.documentElement.setAttribute("data-theme",mode);
  }else{
    document.documentElement.removeAttribute("data-theme");
  }
  var dark = mode === "dark" ||
    (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("themeBtn").textContent = dark ? "Light mode" : "Dark mode";
}
document.getElementById("themeBtn").addEventListener("click",function(){
  var now = document.documentElement.getAttribute("data-theme");
  var dark = now === "dark" ||
    (!now && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var next = dark ? "light" : "dark";
  store(THEME_KEY,next);
  applyTheme(next);
});
applyTheme(recall(THEME_KEY,null));

/* ---------- boot ---------- */
(function boot(){
  var acc = restoreSession();
  if(acc){ openDashboard(acc); }
  else{ document.getElementById("username").focus(); }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Maker</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script>
try{ var m = document.cookie.match(/(?:^|; )hl_theme=(dark|light|system)/), t = m ? m[1] : JSON.parse(localStorage.getItem("hl.theme"));
     if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<style>
/* The Game Maker: describe a game, pay Launchpad Pounds, Claude writes it
   in the slow queue, and everyone can play it. Games run in a sealed
   frame with no sign-in, no storage and no internet. */
:root{
  --bg:#f4f2fb; --card:#fff; --ink:#17142b; --soft:#625d80; --rule:#e4e0f2;
  --a1:#7c3aed; --a2:#06b6d4; --gold:#d97706; --good:#16a34a; --bad:#dc2626; --bar:#160f33;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0c1d; --card:#1a1630; --ink:#ece9fb; --soft:#a49fc4; --rule:#2c2748; --gold:#fbbf24; --good:#4ade80; --bad:#f87171; --bar:#0a0816; } }
:root[data-theme="dark"]{ --bg:#0f0c1d; --card:#1a1630; --ink:#ece9fb; --soft:#a49fc4; --rule:#2c2748; --gold:#fbbf24; --good:#4ade80; --bad:#f87171; --bar:#0a0816; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
a{color:var(--a1)}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:1.1rem;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2))}
.top .sp{flex:1}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.top a{color:#cfc9ef;font-size:.85rem;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700}
.tab[aria-selected="true"]{background:var(--a1);border-color:var(--a1);color:#fff}
.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:18px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 10px}
.muted{color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px;min-height:118px}
.game:hover{border-color:var(--a1)}
.game .em{font-size:1.8rem}
.game b{font-size:1rem;overflow-wrap:anywhere}
.game small{color:var(--soft)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:12px;padding:10px 12px}
textarea{min-height:140px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.ghost{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.msg{margin:10px 0 0;font-weight:600}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ideas button{border:1px dashed var(--rule);background:transparent;border-radius:999px;padding:4px 10px;font-size:.85rem}
.mine{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--rule);border-radius:14px;padding:12px;background:var(--card)}
.mrow .what{flex:1 1 220px;min-width:0}
.mrow .what b{overflow-wrap:anywhere}
.st{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.queued{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.st.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.blocked{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.st.failed{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.note{background:color-mix(in srgb,var(--a1) 8%,var(--card));border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:.92rem;margin-top:14px}
.banned{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 40%,var(--rule))}
/* the player */
.veil{position:fixed;inset:0;background:rgba(6,4,16,.8);z-index:20;display:flex;flex-direction:column}
.pbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--bar);color:#fff;flex-wrap:wrap}
.pbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar small{color:#cfc9ef}
.pbar button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:7px 12px;font-weight:700}
.veil iframe{flex:1;width:100%;border:0;background:#fff}
.sheet{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,4,16,.6);z-index:30;padding:16px}
.sheet .card{width:min(460px,100%)}
.sheet label{display:flex;gap:8px;align-items:center;margin:6px 0}
@media (max-width:520px){ .top{gap:8px;padding:10px 12px} .top a{display:none} }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i>🎮</i>Game Maker</div>
  <span class="sp"></span>
  <span class="chip" id="bal" hidden>🪙 <b id="balN">0</b></span>
  <a href="https://civilinitiatives.org/">← Launchpad</a>
</div>
<main id="main">
  <p class="muted" id="hello">Loading…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="/auth-store.js?b=20261026a"></script>
<script>
(function(){
"use strict";
var SUPABASE_URL = "https://hehs-live.duckdns.org";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkyODMyMjkwLCJleHAiOjIxMDgxOTIyOTB9.7gFhQa5RBwVtiOPLO7Qf2-aVEbkd5xgpLiN1J06Gybo";
var sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true,
  storage:(window.HEHAuth && window.HEHAuth.storage) || undefined } }); } catch (e) {}

var main = document.getElementById("main");
var INFO = null, TAB = "play", BASE = null, poll = null;
var EMOJI = ["🚀","👾","🐉","🏎️","⚽","🧩","🌋","🐸","🛸","🏰","🎯","🐙","🌈","🦖","⭐"];

function h(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function api(body){
  return sb.functions.invoke("gamemaker", { body: body }).then(function(r){
    if (r.error) {
      var ctx = r.error.context;
      if (ctx && ctx.json) return ctx.json().then(function(j){ throw new Error(j && j.error || "Couldn't reach the Game Maker."); },
                                                  function(){ throw new Error("Couldn't reach the Game Maker."); });
      throw new Error("Couldn't reach the Game Maker.");
    }
    if (r.data && r.data.error) throw new Error(r.data.error);
    return r.data;
  });
}
function setBal(n){ document.getElementById("bal").hidden = false; document.getElementById("balN").textContent = n; }
function ago(t){
  var s = (Date.now() - new Date(t).getTime()) / 1000;
  return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago";
}
function untilText(t){ return new Date(t).toLocaleDateString("en-GB", { day:"numeric", month:"long" }); }

/* ---------------- tabs ---------------- */
function draw(){
  main.textContent = "";
  var head = h("div"); head.appendChild(h("h1", null, "Game Maker"));
  head.appendChild(h("p", "muted", "Describe a game and Claude makes it for you. Then everyone on the Launchpad can play it."));
  main.appendChild(head);
  var tabs = h("div", "tabs");
  [["play", "▶ Play"], ["make", "✨ Make a game"], ["mine", "📁 My games"]].forEach(function(t){
    var b = h("button", "tab", t[1]); b.type = "button"; b.setAttribute("aria-selected", TAB === t[0] ? "true" : "false");
    b.onclick = function(){ TAB = t[0]; BASE = null; draw(); }; tabs.appendChild(b);
  });
  main.appendChild(tabs);
  var box = h("div"); main.appendChild(box);
  if (poll) { clearInterval(poll); poll = null; }
  if (TAB === "play") drawPlay(box); else if (TAB === "make") drawMake(box, BASE); else drawMine(box);
}

function drawPlay(box){
  box.appendChild(h("p", "muted", "Loading games…"));
  api({ action:"list" }).then(function(d){
    box.textContent = "";
    if (!d.games.length) {
      var c = h("div", "card"); c.appendChild(h("h2", null, "No games yet"));
      c.appendChild(h("p", "muted", "Be the first - make one!"));
      var b = h("button", "btn", "Make a game"); b.type = "button"; b.onclick = function(){ TAB = "make"; draw(); };
      c.appendChild(b); box.appendChild(c); return;
    }
    var g = h("div", "grid");
    d.games.forEach(function(x){
      var b = h("button", "game"); b.type = "button";
      b.appendChild(h("span", "em", EMOJI[x.id % EMOJI.length]));
      b.appendChild(h("b", null, x.title));
      b.appendChild(h("small", null, "by " + (x.mine ? "you" : x.by || "someone") + " · " + x.plays + " play" + (x.plays === 1 ? "" : "s")));
      b.onclick = function(){ play(x.id); };
      g.appendChild(b);
    });
    box.appendChild(g);
  }).catch(function(e){ box.textContent = ""; box.appendChild(h("p", "msg err", e.message)); });
}

var IDEAS = [
  "A space shooter where you dodge asteroids and collect stars. It gets faster every 20 seconds.",
  "A platformer where a frog jumps between lily pads to reach the top. Falling in the water ends the game.",
  "A maths race: answer times-table questions to make your car go faster than the computer's car.",
  "A snake game, but the snake eats letters and has to spell words.",
  "A penalty shootout: aim and power with a bar, the keeper dives randomly."
];
function drawMake(box, base){
  var c = h("div", "card");
  if (INFO && INFO.banned) {
    c.className = "card banned";
    c.appendChild(h("h2", null, "You can't make games right now"));
    c.appendChild(h("p", null, "A game of yours was reported and taken down, so making games is off for you until " + untilText(INFO.banned) + ". You can still play everyone else's."));
    box.appendChild(c); return;
  }
  var price = base ? INFO.priceChange : INFO.priceNew;
  c.appendChild(h("h2", null, base ? "Change “" + base.title + "”" : "Make a new game"));
  c.appendChild(h("p", "muted", (base ? "Say what to change. " : "") + "Costs 🪙 " + price + " Launchpad Pounds. You have 🪙 " + INFO.pounds + "."));
  var l1 = h("label", "f", "Name"); l1.setAttribute("for", "gTitle"); c.appendChild(l1);
  var title = h("input"); title.type = "text"; title.id = "gTitle"; title.maxLength = 40; title.placeholder = "Asteroid Dodger";
  if (base) title.value = base.title;
  c.appendChild(title);
  var l2 = h("label", "f", base ? "What should change?" : "What's the game?"); l2.setAttribute("for", "gIdea"); c.appendChild(l2);
  var idea = h("textarea"); idea.id = "gIdea"; idea.maxLength = 800;
  idea.placeholder = base ? "Make the enemies slower, add a high score and a purple background." : "What you control, what you have to avoid or collect, how you win or lose, how it gets harder.";
  c.appendChild(idea);
  if (!base) {
    var ideas = h("div", "ideas"); ideas.appendChild(h("small", "muted", "Need an idea? "));
    IDEAS.forEach(function(t){ var b = h("button", null, t.split(" ").slice(0, 4).join(" ") + "…"); b.type = "button"; b.onclick = function(){ idea.value = t; }; ideas.appendChild(b); });
    c.appendChild(ideas);
  }
  var row = h("div", "row");
  var go = h("button", "btn", "Make it for 🪙 " + price); go.type = "button";
  go.disabled = INFO.pounds < price;
  row.appendChild(go);
  if (base) { var cancel = h("button", "ghost", "Cancel"); cancel.type = "button"; cancel.onclick = function(){ TAB = "mine"; BASE = null; draw(); }; row.appendChild(cancel); }
  c.appendChild(row);
  var msg = h("p", "msg"); c.appendChild(msg);
  if (INFO.pounds < price) { msg.className = "msg err"; msg.textContent = "You need " + (price - INFO.pounds) + " more Pounds. Earn them in the learning games (Level Up, Times Tables…) and from achievements."; }
  var note = h("div", "note");
  note.appendChild(h("b", null, "How it works: "));
  note.appendChild(document.createTextNode("First a safeguard reads your idea. If it's not OK for school - swearing (even disguised), real people, rude jokes and so on - it's blocked and you DON'T get your Pounds back; the owner checks every blocked idea. Then " + INFO.model + " builds it in the slow queue, which costs half as much: usually ready within the hour. You can close this page; you'll be told when it's ready. If it can't be built, you get your Pounds back. A game that gets reported and taken down means no game making for a month."));
  c.appendChild(note);
  go.onclick = function(){
    go.disabled = true; msg.className = "msg"; msg.textContent = "Checking your idea…";
    api({ action:"make", title:title.value, idea:idea.value, base: base ? base.id : undefined }).then(function(r){
      INFO.pounds = r.pounds; setBal(r.pounds);
      TAB = "mine"; BASE = null; draw();
    }).catch(function(e){
      msg.className = "msg err"; msg.textContent = e.message; go.disabled = false;
      /* A blocked idea has been paid for: show the new balance. */
      api({ action:"info" }).then(function(i){ INFO = i; setBal(i.pounds); }, function(){});
    });
  };
  box.appendChild(c);
}

function drawMine(box){
  box.appendChild(h("p", "muted", "Loading your games…"));
  function load(){
    return api({ action:"mine" }).then(function(d){
      box.textContent = "";
      if (d.banned) { var bn = h("div", "note banned", "Making games is off for you until " + untilText(d.banned) + ", because a game of yours was taken down after a report."); box.appendChild(bn); }
      if (!d.games.length) { box.appendChild(h("p", "muted", "You haven't made any games yet.")); return; }
      var list = h("div", "mine"), waiting = false;
      d.games.forEach(function(g){
        var r = h("div", "mrow");
        r.appendChild(h("span", "st " + g.status, g.status === "queued" ? "Being made…" : g.status === "done" ? "Ready" : g.status === "blocked" ? (g.review === "upheld" ? "Blocked" : "Blocked · being checked") : "Didn't work"));
        var w = h("div", "what"); w.appendChild(h("b", null, g.title));
        w.appendChild(h("div", "muted", g.status === "queued" ? "Started " + ago(g.created_at) + ". Usually ready within the hour." :
          g.status === "failed" || g.status === "blocked" ? (g.note || "It couldn't be made.") : g.plays + " play" + (g.plays === 1 ? "" : "s") + " by others"));
        r.appendChild(w);
        if (g.status === "queued") waiting = true;
        if (g.status === "done") {
          var p = h("button", "btn", "▶ Play"); p.type = "button"; p.onclick = function(){ play(g.id); }; r.appendChild(p);
          var ch = h("button", "ghost", "Change it"); ch.type = "button"; ch.onclick = function(){ TAB = "make"; BASE = g; draw(); }; r.appendChild(ch);
        }
        if (g.status === "done" || g.status === "failed") {
          var del = h("button", "ghost", "Delete"); del.type = "button";
          del.onclick = function(){
            if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Sure? Delete"; setTimeout(function(){ del.dataset.armed = ""; del.textContent = "Delete"; }, 4000); return; }
            del.disabled = true; api({ action:"delete", id:g.id }).then(load).catch(function(e){ del.disabled = false; alertMsg(e.message); });
          };
          r.appendChild(del);
        }
        list.appendChild(r);
      });
      box.appendChild(list);
      if (waiting && !poll) poll = setInterval(function(){ if (!document.hidden) load(); }, 60000);
      if (!waiting && poll) { clearInterval(poll); poll = null; }
    }).catch(function(e){ box.textContent = ""; box.appendChild(h("p", "msg err", e.message)); });
  }
  load();
}
function alertMsg(t){ var m = h("p", "msg err", t); main.appendChild(m); setTimeout(function(){ m.remove(); }, 4000); }

/* ---------------- playing ----------------
   The game goes into a frame with sandbox="allow-scripts" and nothing
   else: it gets a blank origin of its own, so it can't see the sign-in,
   cookies or storage of the Launchpad, can't open windows or leave the
   page. The policy at the top stops it reaching the internet at all. */
var CSP = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'\">";
function play(id){
  api({ action:"get", id:id }).then(function(g){
    var v = h("div", "veil");
    var bar = h("div", "pbar");
    var t = h("b"); t.textContent = g.title; bar.appendChild(t);
    bar.appendChild(h("small", null, "by " + (g.mine ? "you" : g.by || "someone")));
    if (!g.mine) { var rp = h("button", null, "⚑ Report"); rp.type = "button"; rp.onclick = function(){ report(g); }; bar.appendChild(rp); }
    var again = h("button", null, "↻ Restart"); again.type = "button"; bar.appendChild(again);
    var x = h("button", null, "✕ Close"); x.type = "button"; bar.appendChild(x);
    var f = h("iframe"); f.setAttribute("sandbox", "allow-scripts"); f.setAttribute("title", g.title);
    f.setAttribute("allow", "autoplay");
    function load(){ f.srcdoc = CSP + g.html; }
    load(); again.onclick = load;
    function close(){ v.remove(); document.removeEventListener("keydown", esc); if (location.hash) history.replaceState(null, "", location.pathname); }
    function esc(e){ if (e.key === "Escape" && document.activeElement !== f) close(); }
    x.onclick = close; document.addEventListener("keydown", esc);
    v.appendChild(bar); v.appendChild(f); document.body.appendChild(v);
    f.focus();
  }).catch(function(e){ alertMsg(e.message); });
}

function report(g){
  var s = h("div", "sheet"), c = h("div", "card");
  c.appendChild(h("h2", null, "Report “" + g.title + "”"));
  c.appendChild(h("p", "muted", "The owner and helpers will look at it. " + (g.by || "The maker") + " won't be told who reported it."));
  var reasons = [["rude", "Rude or not suitable for school"], ["unkind", "Unkind or bullying (about a real person)"], ["personal", "Shows someone's personal information"], ["spam", "Broken or spam"], ["other", "Something else"]];
  var pick = null;
  reasons.forEach(function(r){
    var l = h("label"), i = h("input"); i.type = "radio"; i.name = "rr"; i.onchange = function(){ pick = r[0]; send.disabled = false; };
    l.appendChild(i); l.appendChild(document.createTextNode(r[1])); c.appendChild(l);
  });
  var note = h("input"); note.type = "text"; note.placeholder = "Anything to add? (optional)"; note.maxLength = 300; note.style.marginTop = "8px"; c.appendChild(note);
  var row = h("div", "row");
  var send = h("button", "btn", "Send report"); send.type = "button"; send.disabled = true;
  var cancel = h("button", "ghost", "Cancel"); cancel.type = "button"; cancel.onclick = function(){ s.remove(); };
  row.appendChild(send); row.appendChild(cancel); c.appendChild(row);
  var msg = h("p", "msg"); c.appendChild(msg);
  send.onclick = function(){
    send.disabled = true;
    sb.functions.invoke("report", { body:{ action:"report", kind:"game", id:String(g.id), reason:pick, note:note.value } }).then(function(r){
      var d = r.data || {};
      if (r.error || d.error) { msg.className = "msg err"; msg.textContent = d.error || "Couldn't send that - try again."; send.disabled = false; return; }
      msg.className = "msg ok"; msg.textContent = "Thanks - it's been sent."; setTimeout(function(){ s.remove(); }, 1400);
    });
  };
  s.appendChild(c); document.body.appendChild(s);
}

/* ---------------- start ---------------- */
function start(){
  api({ action:"info" }).then(function(i){
    INFO = i; setBal(i.pounds);
    draw();
    var m = location.hash.match(/play=(\d+)/);
    if (m) play(Number(m[1]));
  }).catch(function(e){ main.textContent = ""; main.appendChild(h("p", "msg err", e.message)); });
}
if (!sb) { main.textContent = "Couldn't load. Check your connection and refresh."; }
else sb.auth.getSession().then(function(r){
  if (!r.data || !r.data.session) {
    main.textContent = "";
    var c = h("div", "card");
    c.appendChild(h("h1", null, "🎮 Game Maker"));
    c.appendChild(h("p", "muted", "Describe a game, and Claude makes it for everyone on the Launchpad to play. Sign in on the Launchpad first."));
    var a = h("a", "btn", "Sign in"); a.href = "https://civilinitiatives.org/"; a.style.textDecoration = "none"; a.style.display = "inline-block";
    c.appendChild(a); main.appendChild(c); return;
  }
  start();
});
})();
</script>
</body>
</html>
